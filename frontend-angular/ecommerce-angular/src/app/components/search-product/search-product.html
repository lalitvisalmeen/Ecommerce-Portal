<div class="form-header">
    <!-- searchInput is the template reference variable for the input element-->
    <input #searchInput class="au-input au-input-xl" type="text" placeholder="Search for data ..."
        (keyup.enter)="doSearch(searchInput.value)" />
    <!-- (keyup.enter) is the js keyup event and look for enter key release-->
    <button class="au-btn-submit" (click)="doSearch(searchInput.value)">
        Search
    </button>
</div>
