<div class="login-status-header">

    @if(isAuthenticated()) {

        <div class="account-container">

            <button
                class="account-avatar"
                (click)="toggleAccountMenu()">

                {{ userEmail()?.charAt(0)?.toUpperCase() }}

            </button>

        </div>
    }

    @if(!isAuthenticated()) {
        <button
            (click)="login()"
            class="security-btn">
            Login
        </button>

    }

</div>
