<div class="main-content">
    <div class="section-content section-content-p30 main-content-section">
        <div class="container-fluid">
            <h3 class="mb-4">Your Orders</h3>
            @if(orders().length > 0){
                <table class="table table-bordered orderstable">
                    <thead>
                        <tr>
                            <th width="20%">Order Tracking Number</th>
                            <th width="10%">Total Price</th>
                            <th width="10%">Total Quantity</th>
                            <th width="10%">Date</th>
                        </tr>
                    </thead>
                    <tbody>
                        @for(order of orders(); track order.id){
                            <tr>
                                <td>{{ order.orderTrackingNumber }}</td>
                                <td>{{ order.totalPrice | currency: 'USD' }}</td>
                                <td>{{ order.totalQuantity }}</td>
                                <td>{{ order.createdDate }}</td>
                            </tr>
                        }
                    </tbody>
                </table>
            }
            @else {
                
             <div class="alert alert-warning col-md-12">No records to display</div>
                
            }
        </div>
    </div>
</div>
