<div class="page-wrapper">

  <!-- MENU SIDEBAR-->
  <aside class="menu-sidebar d-none d-lg-block">
    <div class="logo">
      <a routerLink="/products">
        <img src="images/shopping_icon.png" alt="ecommerce-shop" class="img-responsive" height="50">
      </a>
    </div>
    <app-product-category></app-product-category>
  </aside>
  <!-- END MENU SIDEBAR-->
  <!-- PAGE CONTAINER-->
  <div class="page-container">
    <!-- HEADER DESKTOP-->
    <header class="header-desktop">
      <div class="section-content section-content-p30">
        <div class="container-fluid">
          <div class="header-wrap">
            <app-search-product></app-search-product>
            <app-cart-status></app-cart-status>
            <app-login-status #loginStatus></app-login-status>
          </div>
          <div class="account-wrap"></div>
        </div>
      </div>
    </header>
    <!-- END HEADER DESKTOP-->
    <!-- MAIN CONTENT-->
    <!-- <app-product-list></app-product-list> -->
    <!-- Instead of this we will use router-outlet. so that content will be updated dynamically based on the route-->
    <router-outlet></router-outlet>
  </div>
</div>

<!-- End Page container -->
<footer>
  <ul>
    <li><a href="#">About Us</a></li>
    <li><a href="#">Contact Us</a></li>
    <li><a href="#">Help</a></li>
  </ul>
</footer>
<!--
    Transparent layer that prevents the entire application
    from being clicked while the account menu is open.
-->
@if (loginStatus.accountMenuOpen()) {

    <div
        class="account-overlay"
        (click)="loginStatus.toggleAccountMenu()">
    </div>


    <!-- Account menu -->
    <div class="global-account-menu">
        <ul>
            <li class="account-email">{{ loginStatus.userEmail() }}</li>
            <li>
              <button routerLink="/members" type="button" (click)="loginStatus.toggleAccountMenu()">Members</button>
            </li>
            <li>
                <button
                    type="button"
                    (click)="loginStatus.logout()">
                    Logout
                </button>
            </li>
        </ul>
    </div>

}
